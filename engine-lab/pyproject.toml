[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chesslab-engine"
version = "0.3.0"
description = "Educational UCI chess engine (alpha-beta, quiescence, TT) built on python-chess"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["chess==1.11.2"]

[project.scripts]
chesslab-engine = "chesslab_engine.uci:main"

[tool.setuptools]
packages = ["chesslab_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*" = ["E501"]  # long f-strings format CLI report lines
